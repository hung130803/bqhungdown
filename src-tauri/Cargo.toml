[package]
name = "bqhungdown"
version = "0.1.0"
description = "BQHungDown — Tải video đa nền tảng"
authors = ["BQHung"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bqhungdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
tokio-util = "0.7"

thiserror = "1"
anyhow = "1"

chrono = { version = "0.4", features = ["serde"] }

blake3 = "1"
data-encoding = "2"

regex = "1"
url = "2"
indexmap = { version = "2", features = ["serde"] }

dirs = "5"

rusqlite = { version = "0.31", features = ["bundled"] }

parking_lot = "0.12"

# HTTP client — used by url_resolver.rs to follow site-specific redirects
# (e.g., resolve viralhog `/watch/file/<id>` → embed URL `/e/<embed_id>`)
# and to call third-party APIs like TikWM for Douyin resolution.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }

# Clipboard reader (cross-platform, pure Rust). Used by clipboard.rs.
arboard = { version = "3", optional = true }

[dev-dependencies]
proptest = "1"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Enable clipboard auto-detect (requires arboard system deps).
with_arboard = ["dep:arboard"]
default = ["with_arboard"]

# Release build tuned for size + speed:
# - opt-level = "z" → smallest binary (z = "size minimised")
# - lto = "fat"     → cross-crate inlining for ~5-10% speed + size win
# - codegen-units=1 → single CGU lets LTO see everything
# - strip = true    → drop debug symbols (saves several MB)
# - panic = "abort" → no unwinding tables (saves ~500KB, slightly faster)
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
