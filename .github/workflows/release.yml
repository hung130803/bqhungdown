name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cache ffmpeg + aria2c binaries — pinned to stable versions so we can
      # safely re-use across builds. Saves ~1-2 minutes per release. yt-dlp is
      # NOT cached because we want the latest extractor every release.
      - name: Cache ffmpeg + aria2c
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/aria2c-x86_64-pc-windows-msvc.exe
          # Keys include the source URLs — bumping a URL invalidates the cache.
          key: sidecars-windows-ffmpeg-essentials-aria2-1.37.0-v1

      - name: Install npm deps
        run: npm ci

      - name: Fetch latest yt-dlp (always fresh — bundled into installer)
        run: node scripts/fetch-sidecars.mjs --only=ytdlp --force

      - name: Download ffmpeg essentials (skipped on cache hit)
        shell: pwsh
        run: |
          if (Test-Path 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe') {
            Write-Host "ffmpeg already cached — skipping download."
            exit 0
          }
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile 'src-tauri/binaries/ffmpeg-essentials.zip'
          Expand-Archive -Path 'src-tauri/binaries/ffmpeg-essentials.zip' -DestinationPath 'src-tauri/binaries/_extract' -Force
          $exe = Get-ChildItem -Path 'src-tauri/binaries/_extract' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe' -Force
          Remove-Item -Recurse -Force 'src-tauri/binaries/_extract'
          Remove-Item -Force 'src-tauri/binaries/ffmpeg-essentials.zip'

      - name: Download aria2c (skipped on cache hit)
        shell: pwsh
        run: |
          if (Test-Path 'src-tauri/binaries/aria2c-x86_64-pc-windows-msvc.exe') {
            Write-Host "aria2c already cached — skipping download."
            exit 0
          }
          $url = 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile 'aria2.zip'
          Expand-Archive -Path 'aria2.zip' -DestinationPath '_aria_extract' -Force
          $exe = Get-ChildItem -Path '_aria_extract' -Recurse -Filter 'aria2c.exe' | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination 'src-tauri/binaries/aria2c-x86_64-pc-windows-msvc.exe' -Force
          Remove-Item -Recurse -Force '_aria_extract'
          Remove-Item -Force 'aria2.zip'

      - name: Build + Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BQHungDown ${{ github.ref_name }}"
          releaseBody: "Bản cập nhật ${{ github.ref_name }}. App sẽ tự thông báo cho user — họ chỉ cần bấm Cập nhật."
          releaseDraft: false
          prerelease: false
          # Generate latest.json for the updater plugin to consume.
          updaterJsonPreferNsis: true
